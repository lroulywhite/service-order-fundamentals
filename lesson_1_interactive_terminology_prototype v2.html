<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Service Order Fundamentals: Lesson 1 prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--border-strong:#C9C9D6;--text-secondary:#5A5A72}
html,body{height:100%;margin:0;padding:0;background:#fff;color-scheme:light;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.sl{background:#fff;color:#1A1A2E;height:100%;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.hd{background:#1F1F5C;padding:12px 20px 10px}
.eb{font-size:11px;font-weight:500;color:#F4D44D;letter-spacing:.05em;text-transform:uppercase;margin:0}
.tt{font-size:20px;font-weight:500;color:#fff;margin:1px 0 0;line-height:1.25}
.pg{display:flex;gap:4px;margin-top:10px}
.pg i{flex:1;height:4px;background:#4A4A8A;display:block}
.pg i.on{background:#F4D44D}
.bd{padding:16px 20px;flex:1;min-height:0;overflow:hidden}
.hd,.vo,.ft{flex:none}
.q{font-size:11px;font-weight:500;color:#3B3BDB;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.h{font-size:17px;font-weight:500;margin:0 0 4px;line-height:1.35;color:#1A1A2E}
.p{font-size:13px;line-height:1.5;margin:0;color:#3A3A52}
.cols{display:flex;gap:16px;margin-top:12px;align-items:stretch}
.cd{background:#EDEBFB;border-radius:10px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:6px;margin-top:4px;background:#fff;border:1px solid #DAD6F5;transition:opacity .15s}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dim{opacity:.3}
.wo{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:#fff;border:1.5px solid #C9C4F0;border-radius:10px;padding:9px 12px;margin-top:8px}
.wo:hover{border-color:#3B3BDB}
.wo:focus-visible{outline:2px solid #3B3BDB;outline-offset:2px}
.wo.sel{border-color:#3B3BDB;background:#F5F4FF}
.pill{display:inline-block;background:#3B3BDB;color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:500}
.tag{font-size:11px;font-weight:500;color:#3B3BDB;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.vo{display:flex;gap:10px;align-items:flex-start;background:#F4F4F8;border-top:1px solid #E4E4EE;padding:9px 20px;font-size:12px;line-height:1.45;color:#3A3A52}
.ft{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-top:1px solid #E4E4EE;background:#fff}
.b{all:unset;box-sizing:border-box;cursor:pointer;font-size:13px;font-weight:500;padding:8px 18px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.b:focus-visible{outline:2px solid #3B3BDB;outline-offset:2px}
.b.pr{background:#3B3BDB;color:#fff}
.b.pr:hover{background:#2D2DB8}
.b.gh{color:#3B3BDB}
.b.gh:hover{background:#EDEBFB}
.op{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;font-size:13px;padding:8px 12px;border:1.5px solid #C9C4F0;border-radius:8px;background:#fff;margin-top:6px;color:#1A1A2E}
.op:hover{border-color:#3B3BDB}
.op:focus-visible{outline:2px solid #3B3BDB;outline-offset:2px}
.op.ok{border-color:#15803D;background:#F0FDF4}
.op.no{border-color:#B91C1C;background:#FEF2F2}
.fbk{font-size:12px;margin:6px 0 0;line-height:1.45}
.cap{font-size:12px;color:var(--text-secondary);margin:0 0 6px}
@media (max-width:560px){.cols{flex-direction:column}.bd{overflow-y:auto}}
</style>
</head>
<body>
<h2 class="sr-only">Interactive prototype of Lesson 1, Order Management Terminology, with eight screens: a scenario, a work order reveal, a booking order and vocabulary summary, order types, three practice questions, and a recap.</h2>
<div class="sl" id="app"></div>
<script>
var S={step:0,sel:null,ans:{}};
var D={f:{n:'Food service',c:'#B45309'},a:{n:'Audio visual',c:'#0F766E'},c:{n:'Facilities',c:'#6D28D9'}};
var IT=[{n:'Boxed lunch',q:200,d:'f'},{n:'Coffee break package',q:50,d:'f'},{n:'Audio technician',q:2,d:'a'},{n:'Chairs',q:250,d:'c'}];
var QS=[
{q:'Your AV team needs to know what to set up in Hall A on Dec 7. Where should they look?',o:[
{t:'The service order',ok:0,fb:'The service order has everything, not just AV items. Operations teams use something narrower.'},
{t:'A work order',ok:1,fb:'Right. Work orders are split by department, day, and space for operations teams.'},
{t:'The booking order',ok:0,fb:'Booking orders hold space rental charges, not equipment or labor.'}]},
{q:'You added a booking and chose a rate. A new order with the space rental charge appeared on its own. What is it?',o:[
{t:'A work order',ok:0,fb:'Work orders are built from your service orders, not from bookings.'},
{t:'A booking order',ok:1,fb:'Right. Momentus creates it to hold the space rental charges.'},
{t:'A forecast order',ok:0,fb:'Forecast orders are ones you create yourself, well before an event.'}]},
{q:'Twenty more chairs are needed. Where do you add them?',o:[
{t:'On the service order',ok:1,fb:'Right. You enter items on the service order, and work orders are created from it.'},
{t:'On the work order',ok:0,fb:'Work orders are created by the system. You enter items on the service order.'},
{t:'On the booking order',ok:0,fb:'Booking orders only hold space rental charges.'}]}];
var VO=[
'Picture a banquet for 250 guests. Everything the event needs goes on one list: the service order. Let\u2019s save it and see what Momentus does.',
'You entered one order. Momentus split it into work orders: one for each department, each day, and each space. Select one to see its items.',
'When you add a booking and pick a rate, Momentus also creates a booking order for the space rental. Here\u2019s where to find each kind of order.',
'Momentus has three order types. Most customers only use regular service orders, and that\u2019s completely fine.',
'Let\u2019s check what you\u2019ve learned. Pick the best answer for question 1.',
'Question 2. Pick the best answer.',
'Question 3. Pick the best answer.',
'Nice work. You can now tell service, work, and booking orders apart, and you know where each one lives.'];
var T=['Order Management Terminology','Order Management Terminology','Order Management Terminology','Order Types','Check Your Understanding','Check Your Understanding','Check Your Understanding','Course Recap'];
function rows(){var h='';IT.forEach(function(i){var cls='row'+(S.sel&&S.sel!==i.d?' dim':'');h+='<div class="'+cls+'"><span class="dot" style="background:'+D[i.d].c+'"></span><span style="flex:1">'+i.n+'</span><span style="color:#5A5A72">\u00d7 '+i.q+'</span></div>';});return h;}
function s0(){return '<p class="q">Learning goal</p><p class="h">What\u2019s the difference between service orders, work orders, and booking orders?</p>'+
'<div class="cols"><div style="flex:1;min-width:0"><p class="tag" style="margin-top:6px">Scenario</p><p class="h" style="font-size:15px">Southeast Chapter Scholarship Banquet</p><p class="p">250 guests \u00b7 Dec 7 \u00b7 Hall A</p><p class="p" style="margin-top:10px">Everything the event needs goes on one list. That list is the <b style="color:#3B3BDB">service order</b>: your shopping list for the event.</p></div>'+
'<div class="cd" style="flex:1.1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">Service Order</span><span style="font-size:11px;color:#5A5A72">Attached to a function</span></div>'+rows()+'</div></div>';}
function s1(){var wos='';['f','a','c'].forEach(function(d){var n=IT.filter(function(i){return i.d===d}).length;var on=S.sel===d;
wos+='<button class="wo'+(on?' sel':'')+'" onclick="pick(\''+d+'\')" aria-pressed="'+on+'"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:'+D[d].c+'"></span><span style="font-size:13px;font-weight:500;flex:1">Work Order: '+D[d].n+'</span><span style="font-size:11px;color:#5A5A72">'+n+(n>1?' items':' item')+'</span></div><div style="font-size:12px;color:#5A5A72;margin:2px 0 0 18px">Hall A \u00b7 Dec 7</div></button>';});
var msg=S.sel?'This work order has only the '+D[S.sel].n.toLowerCase()+' items, for Hall A on Dec 7.':'Select a work order to see which items it holds.';
return '<p class="q">Watch what happens</p><p class="h">Save the order, and Momentus builds the work orders for you.</p>'+
'<div class="cols"><div class="cd" style="flex:1;min-width:0"><span class="pill">Service Order</span>'+rows()+'</div><div style="align-self:center;color:#3B3BDB;font-size:22px" aria-hidden="true"><i class="ti ti-arrow-right"></i></div><div style="flex:1.1;min-width:0">'+wos+'</div></div>'+
'<p class="p" style="margin-top:12px;font-weight:500;color:#3B3BDB" aria-live="polite"><i class="ti ti-pointer" aria-hidden="true"></i> '+msg+'</p>'+
'<p class="p" style="margin-top:4px">One work order for each department, each day, and each space.</p>';}
function s2(){function c(p,w,f){return '<div class="cd" style="flex:1;min-width:0;background:#fff;border:1.5px solid #C9C4F0"><span class="pill">'+p+'</span><p class="p" style="margin-top:8px">'+w+'</p><p class="p" style="margin-top:8px;font-size:12px;color:#5A5A72"><i class="ti ti-map-pin" aria-hidden="true"></i> '+f+'</p></div>';}
return '<p class="q">One more order</p><p class="h">Booking orders appear on their own when you add a booking.</p><p class="p">Pick a rate for the booking, and Momentus creates a service order to hold the space rental charges.</p>'+
'<p class="tag" style="margin-top:14px">Who creates it, and where you\u2019ll find it</p>'+
'<div class="cols" style="margin-top:0">'+c('Service Order','You create it. Items and charges for the event.','Service Orders tab')+c('Work Order','Momentus creates it from your service orders.','Work Orders tab')+c('Booking Order','Momentus creates it from your bookings.','Service Orders tab')+'</div>';}
function s3(){function n(i,t,d,hi){return '<div class="cd" style="flex:1;min-width:0;'+(hi?'border:2px solid #3B3BDB;background:#F5F4FF':'')+'"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:24px;height:24px;border-radius:50%;background:#3B3BDB;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center">'+i+'</span>'+(hi?'<span class="pill" style="background:#1F1F5C;font-size:11px">Most common</span>':'')+'</div><p class="h" style="font-size:14px;margin:0;color:#3B3BDB">'+t+'</p><p class="p" style="margin-top:4px">'+d+'</p></div>';}
return '<p class="q">Know your options</p><p class="h">Momentus has three types of orders.</p><p class="p">Most customers only use regular service orders, and that\u2019s completely fine.</p>'+
'<div class="cols" style="margin-top:14px">'+n(1,'Forecast Order','High-level estimates, entered well before the event.',0)+n(2,'Revised Forecast Order','A second version, with the original kept intact.',0)+n(3,'Service Order','Use it once you\u2019re ready to add specific details.',1)+'</div>'+
'<p class="p" style="margin-top:12px;color:#5A5A72"><i class="ti ti-info-circle" aria-hidden="true"></i> Not using forecasts? You can skip them. The rest of this path covers service orders.</p>';}
function sq(qi){var Q=QS[qi],a=S.ans[qi]||{t:[],d:0};var h='<p class="q">Check your understanding \u00b7 Question '+(qi+1)+' of 3</p><p class="h" style="margin-top:6px">'+Q.q+'</p><div style="margin-top:10px">';
Q.o.forEach(function(o,oi){var cls='op';if(a.t.indexOf(oi)>-1)cls+=o.ok?' ok':' no';h+='<button class="'+cls+'" onclick="ans('+qi+','+oi+')">'+o.t+'</button>';});
h+='</div>';
if(a.t.length){var last=Q.o[a.t[a.t.length-1]];h+='<p class="fbk" aria-live="polite" style="color:'+(last.ok?'#15803D':'#B91C1C')+'">'+(last.ok?'Correct. ':'Not quite. ')+last.fb+'</p>';}
return h;}
function s5(){var sc=0;QS.forEach(function(Q,qi){var a=S.ans[qi];if(a&&a.t.length===1&&Q.o[a.t[0]].ok)sc++;});
function g(t){return '<div class="row" style="padding:9px 12px;font-size:14px"><i class="ti ti-circle-check" style="color:#15803D;font-size:20px" aria-hidden="true"></i><span>'+t+'</span></div>';}
return '<p class="q">Course recap</p><p class="h">In this lesson, you learned how to:</p>'+g('Tell service orders, work orders, and booking orders apart')+g('Explain that you enter service orders and Momentus builds work orders')+g('Choose the right order type for where you are in planning')+
'<p class="p" style="margin-top:12px">You answered '+sc+' of 3 correctly on the first try.</p><p class="p" style="margin-top:4px;color:#3B3BDB;font-weight:500">Up next: How service orders connect to functions</p>';}
function render(){var N=8,pg='';for(var i=0;i<N;i++)pg+='<i class="'+(i<=S.step?'on':'')+'"></i>';
var body=[s0,s1,s2,s3,function(){return sq(0)},function(){return sq(1)},function(){return sq(2)},s5][S.step]();
var nl=['Save the order','Next','Next','Next','Next','Next','Next','Finish lesson'][S.step];
document.getElementById('app').innerHTML='<div class="hd"><p class="eb">Service Order Management</p><p class="tt">'+T[S.step]+'</p><div class="pg" role="img" aria-label="Screen '+(S.step+1)+' of '+N+'">'+pg+'</div></div><div class="bd">'+body+'</div><div class="vo"><i class="ti ti-bulb" style="font-size:18px;color:#3B3BDB;flex:none" aria-hidden="true"></i><span><b>Pro Tip:</b> '+VO[S.step]+'</span></div><div class="ft"><button class="b gh" onclick="go(-1)" style="'+(S.step?'':'visibility:hidden')+'"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button><span style="font-size:12px;color:#5A5A72">'+(S.step+1)+' of '+N+'</span><button class="b pr" onclick="go(1)">'+nl+' <i class="ti ti-arrow-right" aria-hidden="true"></i></button></div>';}
function go(d){S.step=Math.max(0,Math.min(7,S.step+d));S.sel=null;render();}
function pick(d){S.sel=S.sel===d?null:d;render();}
function ans(q,o){var a=S.ans[q]||(S.ans[q]={t:[],d:0});if(a.d)return;if(a.t.indexOf(o)>-1)return;a.t.push(o);if(QS[q].o[o].ok)a.d=1;render();}
render();
</script>
</body>
</html>
